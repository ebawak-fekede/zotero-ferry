<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
     xmlns:html="http://www.w3.org/1999/xhtml"
     id="zotero-ferry-prefpane">
	<groupbox>
		<label><html:h2>Zotero Ferry</html:h2></label>
		<description>Promote linked attachments to stored files for mobile reading, then return them to their original linked paths.</description>
		<hbox align="center">
			<label value="Tag marking a promoted item:"/>
			<html:input type="text" id="zotero-ferry-storedTag" preference="extensions.zotero-ferry.storedTag"/>
		</hbox>
		<hbox align="center">
			<label value="Origin memory tag prefix:"/>
			<html:input type="text" id="zotero-ferry-originTagPrefix" preference="extensions.zotero-ferry.originTagPrefix"/>
		</hbox>
		<checkbox id="zotero-ferry-confirmPromote" preference="extensions.zotero-ferry.confirmPromote"
			label="Confirm before promoting to stored"/>
		<checkbox id="zotero-ferry-confirmRevert" preference="extensions.zotero-ferry.confirmRevert"
			label="Confirm before returning to linked"/>
		<checkbox id="zotero-ferry-dryRun" preference="extensions.zotero-ferry.dryRun"
			label="Dry run: report what would change, write nothing"/>
	</groupbox>
</vbox>
